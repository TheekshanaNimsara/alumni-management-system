<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post a Job – Alumni Network</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">
  <link rel="shortcut icon" href="./favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="jobs.css?v=4.0" />
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <a href="index.html" class="brand-link" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
        <div class="logo-box">AN</div>
        <span class="navbar-title">Alumni Network</span>
      </a>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="event.html">Events</a>
      <a href="jobs.html">Jobs</a>
    </nav>
  </header>

  <main class="form-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.75rem;">
      <a class="back btn-return-home" href="index.html">&larr; Return to Homepage</a>
      <a class="back" href="jobs.html">&larr; Back to Jobs Board</a>
    </div>

    <div class="form-card">
      <h1>Post a Job</h1>
      <p class="subtitle">Share an opportunity with fellow alumni. Submissions will be sent for admin approval before appearing on the job board.</p>

      <!-- Error banner (shown when job.php redirects back with ?error=…) -->
      <div id="errorBanner" style="display:none;background:var(--danger-bg);color:var(--danger-color);border:1px solid rgba(239, 68, 68, 0.3);
           padding:10px 16px;border-radius:6px;margin-bottom:16px;font-weight:600;"></div>

      <form action="job.php?action=create" method="POST">
        <div class="form-group">
          <label for="jobTitle">Job Title *</label>
          <input type="text" id="jobTitle" name="jobTitle"
                 placeholder="e.g. Senior Software Engineer" required />
        </div>

        <div class="form-group">
          <label for="companyName">Company Name *</label>
          <input type="text" id="companyName" name="companyName"
                 placeholder="e.g. Sysco LABS / Google" required />
        </div>

        <div class="form-group">
          <label for="description">Job Description *</label>
          <textarea id="description" name="description" rows="4"
                    placeholder="Describe the role responsibilities, day-to-day work, and project scope..." required></textarea>
        </div>

        <div class="form-group">
          <label for="requirements">Requirements &amp; Tech Stack</label>
          <textarea id="requirements" name="requirements" rows="3"
                    placeholder="e.g. 2+ years PHP/MySQL experience, strong problem solving, Git workflow"></textarea>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
          <div class="form-group">
            <label for="location">Location *</label>
            <input type="text" id="location" name="location"
                   placeholder="e.g. Colombo, Sri Lanka / Remote" required />
          </div>

          <div class="form-group">
            <label for="jobType">Job Type *</label>
            <select id="jobType" name="jobType" required>
              <option value="Full-Time">Full-Time</option>
              <option value="Part-Time">Part-Time</option>
              <option value="Internship">Internship</option>
              <option value="Contract">Contract</option>
              <option value="Remote">Remote</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">
          <div class="form-group">
            <label for="contactEmail">Contact Email <span style="font-weight:400;color:var(--text-muted);">(for applicants)</span></label>
            <input type="email" id="contactEmail" name="contactEmail"
                   placeholder="e.g. careers@company.com" />
          </div>

          <div class="form-group">
            <label for="deadline">Application Deadline</label>
            <input type="date" id="deadline" name="deadline" />
          </div>
        </div>

        <div style="margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
          <a href="jobs.html" class="btn btn-outline">Cancel</a>
          <button type="submit" class="btn btn-primary submit-btn">Post Opportunity</button>
        </div>
      </form>
    </div>
  </main>

  <script>
    // Require authentication prior to job creation
    (async function verifyAuth() {
      try {
        const res = await fetch("job.php?action=session");
        if (res.ok) {
          const text = await res.text();
          if (!text.trim().startsWith("<")) {
            const data = JSON.parse(text);
            if (!data || !data.logged_in) {
              const isStatic = window.location.protocol === "file:" || window.location.hostname.endsWith("github.io");
              const loginTarget = isStatic
                ? "login.html?redirect=" + encodeURIComponent("jobcreate.html") + "&msg=auth_required"
                : "auth/login.php?redirect=" + encodeURIComponent("../jobcreate.html") + "&msg=auth_required";
              window.location.href = loginTarget;
              return;
            }
          } else {
            // Static host probe
            if (sessionStorage.getItem("alumni_logged_in") !== "true") {
              window.location.href = "login.html?redirect=" + encodeURIComponent("jobcreate.html") + "&msg=auth_required";
              return;
            }
          }
        }
      } catch (e) {
        if (window.location.hostname.endsWith("github.io") && sessionStorage.getItem("alumni_logged_in") !== "true") {
          window.location.href = "login.html?redirect=" + encodeURIComponent("jobcreate.html") + "&msg=auth_required";
        }
      }
    })();

    // Show error message if redirected back from job.php with ?error=
    (function () {
      const params = new URLSearchParams(window.location.search);
      const err = params.get("error");
      if (err) {
        const banner = document.getElementById("errorBanner");
        banner.textContent = "⚠ " + decodeURIComponent(err);
        banner.style.display = "block";
        history.replaceState({}, "", "jobcreate.html");
      }
    })();
  </script>

</body>
</html>
