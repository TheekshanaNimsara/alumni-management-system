<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120305" />
      <stop offset="50%" stop-color="#24070A" />
      <stop offset="100%" stop-color="#4A1116" />
    </linearGradient>
    <radialGradient id="goldAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#120305" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#eventBg)" />
  <circle cx="300" cy="175" r="150" fill="url(#goldAmbient)" />
  
  <!-- Subtle Architectural Pillars & Stage Silhouette -->
  <rect x="50" y="270" width="500" height="40" fill="#120305" />
  <rect x="90" y="100" width="18" height="170" fill="#1C080B" />
  <rect x="140" y="100" width="18" height="170" fill="#1C080B" />
  <rect x="440" y="100" width="18" height="170" fill="#1C080B" />
  <rect x="490" y="100" width="18" height="170" fill="#1C080B" />
  
  <!-- Calendar / Auditorium Icon in Gold -->
  <g transform="translate(250, 105)" fill="none" stroke="#D4AF37" stroke-width="4">
    <rect x="0" y="15" width="100" height="85" rx="10" stroke-width="4" fill="#120305" fill-opacity="0.85" />
    <line x1="0" y1="40" x2="100" y2="40" stroke-width="3" />
    <line x1="25" y1="0" x2="25" y2="20" stroke-width="5" stroke-linecap="round" />
    <line x1="75" y1="0" x2="75" y2="20" stroke-width="5" stroke-linecap="round" />
    <circle cx="32" cy="62" r="5" fill="#D4AF37" />
    <circle cx="50" cy="62" r="5" fill="#D4AF37" />
    <circle cx="68" cy="62" r="5" fill="#D4AF37" />
    <circle cx="32" cy="80" r="5" fill="#D4AF37" />
    <circle cx="50" cy="80" r="5" fill="#D4AF37" />
    <circle cx="68" cy="80" r="5" fill="#D4AF37" />
  </g>
  <text x="300" y="235" text-anchor="middle" fill="#D4AF37" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="18" letter-spacing="3">CAMPUS CONVOCATION &amp; NETWORKING</text>
