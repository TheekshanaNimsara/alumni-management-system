<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBackdrop" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3A0D14" />
      <stop offset="65%" stop-color="#1A0407" />
      <stop offset="100%" stop-color="#0E0204" />
    </radialGradient>
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D77A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A98218" />
    </linearGradient>
    <linearGradient id="softCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E0508" />
      <stop offset="100%" stop-color="#100204" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Backdrop -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBackdrop)" />
  <circle cx="100" cy="100" r="96" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Silhouette Head in Metallic Gold -->
  <circle cx="100" cy="80" r="34" fill="url(#metallicGold)" />

  <!-- Silhouette Shoulders / Torso in Metallic Gold -->
  <path d="M 42 176 C 44 134 70 122 100 122 C 130 122 156 134 158 176 Z" fill="url(#metallicGold)" />

  <!-- Editorial Graduation Cap with Gold Rim Highlight -->
  <polygon points="100,32 146,48 100,64 54,48" fill="url(#softCap)" stroke="#F1D77A" stroke-width="2.5" />
  <rect x="96" y="44" width="8" height="10" fill="url(#softCap)" stroke="#D4AF37" stroke-width="1.5" />
  <path d="M 138 52 C 142 62 142 74 140 82" stroke="#F1D77A" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <circle cx="140" cy="83" r="3" fill="#F1D77A" />
</svg>
