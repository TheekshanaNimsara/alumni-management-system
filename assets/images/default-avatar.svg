<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarBackdrop" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#241735" />
      <stop offset="65%" stop-color="#10091D" />
      <stop offset="100%" stop-color="#080510" />
    </radialGradient>
    <linearGradient id="metallicViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="35%" stop-color="#C4B5FD" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="softCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1230" />
      <stop offset="100%" stop-color="#080510" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Backdrop -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarBackdrop)" />
  <circle cx="100" cy="100" r="96" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Silhouette Head in Metallic Violet -->
  <circle cx="100" cy="80" r="34" fill="url(#metallicViolet)" />

  <!-- Silhouette Shoulders / Torso in Metallic Violet -->
  <path d="M 42 176 C 44 134 70 122 100 122 C 130 122 156 134 158 176 Z" fill="url(#metallicViolet)" />

  <!-- Editorial Graduation Cap with Lavender Rim Highlight -->
  <polygon points="100,32 146,48 100,64 54,48" fill="url(#softCap)" stroke="#C4B5FD" stroke-width="2.5" />
  <rect x="96" y="44" width="8" height="10" fill="url(#softCap)" stroke="#9333EA" stroke-width="1.5" />
  <path d="M 138 52 C 142 62 142 74 140 82" stroke="#E9D5FF" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <circle cx="140" cy="83" r="3" fill="#E9D5FF" />
</svg>
