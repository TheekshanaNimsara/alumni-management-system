<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Cinematic Royal Burgundy & Champagne Gold Twilight Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09060B" />
      <stop offset="28%" stop-color="#100810" />
      <stop offset="52%" stop-color="#1A101B" />
      <stop offset="70%" stop-color="#451629" />
      <stop offset="86%" stop-color="#762D48" />
      <stop offset="94%" stop-color="#98415F" />
      <stop offset="100%" stop-color="#E8C77E" stop-opacity="0.85" />
    </linearGradient>

    <!-- Warm Champagne Gold & Rose Radiance behind Campus Silhouette -->
    <radialGradient id="sunGlow" cx="65%" cy="72%" r="48%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.95" />
      <stop offset="18%" stop-color="#F5DDA0" stop-opacity="0.85" />
      <stop offset="38%" stop-color="#E8C77E" stop-opacity="0.60" />
      <stop offset="62%" stop-color="#B65B78" stop-opacity="0.35" />
      <stop offset="82%" stop-color="#762D48" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#100810" stop-opacity="0" />
    </radialGradient>

    <!-- Window & Clock Light Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clock Core Glow -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="55%" stop-color="#F5DDA0" />
      <stop offset="85%" stop-color="#E8C77E" />
      <stop offset="100%" stop-color="#BE984B" />
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />

  <!-- Radiance behind Campus -->
  <circle cx="1250" cy="690" r="360" fill="url(#sunGlow)" />

  <!-- Secondary Soft Violet-Burgundy Ambient Horizon Orb -->
  <circle cx="480" cy="740" r="280" fill="url(#sunGlow)" opacity="0.45" />

  <!-- Distant Mountain / Forest Ridge Silhouette -->
  <path d="M0,820 Q320,775 640,805 T1280,785 T1920,805 L1920,1080 L0,1080 Z" fill="#0D070E" opacity="0.92" />

  <!-- University Quad Trees Silhouette -->
  <g fill="#0D070E">
    <ellipse cx="220" cy="805" rx="95" ry="125" />
    <ellipse cx="310" cy="825" rx="75" ry="95" />
    <ellipse cx="140" cy="835" rx="65" ry="85" />
    <ellipse cx="1680" cy="795" rx="105" ry="135" />
    <ellipse cx="1780" cy="815" rx="85" ry="105" />
    <ellipse cx="1580" cy="825" rx="75" ry="95" />
  </g>

  <!-- Campus Neoclassical Hall & Clock Tower Architecture Silhouette -->
  <!-- Main Foundation -->
  <rect x="360" y="740" width="1200" height="220" fill="#09060B" />

  <!-- Front Portico Columns & Pediment -->
  <g fill="#150F17">
    <rect x="760" y="650" width="400" height="20" fill="#211721" /> <!-- Architrave -->
    <polygon points="740,650 960,560 1180,650" fill="#0D070E" /> <!-- Pediment -->
    <!-- Architectural Dentils / Gold Trim on Pediment -->
    <polygon points="750,648 960,564 1170,648" fill="none" stroke="#E8C77E" stroke-width="1.5" opacity="0.35" />
    <!-- Columns -->
    <rect x="780" y="670" width="22" height="190" />
    <rect x="830" y="670" width="22" height="190" />
    <rect x="880" y="670" width="22" height="190" />
    <rect x="930" y="670" width="22" height="190" />
    <rect x="980" y="670" width="22" height="190" />
    <rect x="1030" y="670" width="22" height="190" />
    <rect x="1080" y="670" width="22" height="190" />
    <rect x="1130" y="670" width="22" height="190" />
  </g>

  <!-- Left Wing -->
  <rect x="380" y="700" width="380" height="160" fill="#09060B" />
  <polygon points="360,700 570,640 780,700" fill="#150F17" />

  <!-- Right Wing -->
  <rect x="1160" y="700" width="380" height="160" fill="#09060B" />
  <polygon points="1140,700 1350,640 1560,700" fill="#150F17" />

  <!-- Iconic University Clock Tower (Center) -->
  <g fill="#09060B">
    <rect x="915" y="320" width="90" height="240" />
    <polygon points="895,320 960,180 1025,320" fill="#0D070E" /> <!-- Spire -->
    <!-- Spire Gold Finial -->
    <circle cx="960" cy="180" r="5" fill="#E8C77E" filter="url(#glow)" />
    <!-- Tower Balcony & Details -->
    <rect x="900" y="380" width="120" height="16" fill="#1A101B" />
    <rect x="905" y="480" width="110" height="14" fill="#1A101B" />
    
    <!-- Clock Face Glowing in Champagne Gold -->
    <circle cx="960" cy="430" r="26" fill="#E8C77E" filter="url(#glow)" opacity="0.95" />
    <circle cx="960" cy="430" r="22" fill="url(#clockGlow)" />
    <!-- Clock Ring Border -->
    <circle cx="960" cy="430" r="22" fill="none" stroke="#BE984B" stroke-width="1.5" />
    <!-- Clock Hands -->
    <line x1="960" y1="430" x2="960" y2="414" stroke="#100810" stroke-width="3" stroke-linecap="round" />
    <line x1="960" y1="430" x2="973" y2="437" stroke="#100810" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Warm Windows with Radiant Champagne Gold Light Glow -->
  <g fill="#F5DDA0" opacity="0.90" filter="url(#glow)">
    <!-- Tower Windows -->
    <rect x="948" y="505" width="10" height="22" rx="5" />
    <rect x="962" y="505" width="10" height="22" rx="5" />
    <!-- Left Wing Windows -->
    <rect x="420" y="730" width="20" height="35" rx="3" />
    <rect x="470" y="730" width="20" height="35" rx="3" />
    <rect x="520" y="730" width="20" height="35" rx="3" />
    <rect x="570" y="730" width="20" height="35" rx="3" />
    <rect x="620" y="730" width="20" height="35" rx="3" />
    <rect x="670" y="730" width="20" height="35" rx="3" />
    <rect x="420" y="790" width="20" height="35" rx="3" />
    <rect x="470" y="790" width="20" height="35" rx="3" />
    <rect x="520" y="790" width="20" height="35" rx="3" />
    <rect x="570" y="790" width="20" height="35" rx="3" />
    <rect x="620" y="790" width="20" height="35" rx="3" />
    <rect x="670" y="790" width="20" height="35" rx="3" />
    <!-- Right Wing Windows -->
    <rect x="1230" y="730" width="20" height="35" rx="3" />
    <rect x="1280" y="730" width="20" height="35" rx="3" />
    <rect x="1330" y="730" width="20" height="35" rx="3" />
    <rect x="1380" y="730" width="20" height="35" rx="3" />
    <rect x="1430" y="730" width="20" height="35" rx="3" />
    <rect x="1480" y="730" width="20" height="35" rx="3" />
    <rect x="1230" y="790" width="20" height="35" rx="3" />
    <rect x="1280" y="790" width="20" height="35" rx="3" />
    <rect x="1330" y="790" width="20" height="35" rx="3" />
    <rect x="1380" y="790" width="20" height="35" rx="3" />
    <rect x="1430" y="790" width="20" height="35" rx="3" />
    <rect x="1480" y="790" width="20" height="35" rx="3" />
  </g>

  <!-- Foreground Quad Lawn -->
  <polygon points="0,920 1920,920 1920,1080 0,1080" fill="#09060B" />
  <!-- Walkway Reflection in Warm Burgundy & Champagne Surface -->
  <polygon points="960,920 1140,1080 780,1080" fill="#30202E" opacity="0.75" />
  <line x1="960" y1="920" x2="960" y2="1080" stroke="#E8C77E" stroke-width="2" opacity="0.30" />
</svg>
