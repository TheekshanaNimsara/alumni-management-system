<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C171A"/>
      <stop offset="100%" stop-color="#100D10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CB83"/>
      <stop offset="100%" stop-color="#D8B96A"/>
    </linearGradient>
  </defs>
  <style>
    .brand-bg { fill: url(#bgGrad); stroke: #D8B96A; stroke-width: 2.5; }
    .brand-text { fill: url(#goldGrad); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 32px; font-weight: 900; letter-spacing: -1px; text-anchor: middle; }
    @media (prefers-color-scheme: light) {
      .brand-bg { fill: #FDFBF7 !important; stroke: #541923 !important; }
