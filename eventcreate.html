<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event</title>
  <link rel="stylesheet" href="event.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="event.html"><span class="logo">AN</span> Alumni Network</a>
      <nav>
        <a href="event.html">Events</a>
        <a href="jobs.html">Jobs</a>
      </nav>
    </div>
  </header>

  <main class="wrap narrow">
    <a class="back" href="event.html">&larr; Back to Events</a>

    <div class="form-card">
      <h1>Create a New Event</h1>
      <p class="muted">Fill in the details and publish it to the alumni events page.</p>

      <!-- Filled in by create-event.js if save-event.php sends back ?error=... -->
      <div class="error-box" id="errorBox" hidden></div>

      <!-- Plain HTML form. It posts straight to event.php?action=save -->
      <form id="eventForm" action="event.php?action=save" method="post">
        <div class="form-group">
          <label for="title">Event Title *</label>
          <input type="text" name="title" id="title" required placeholder="e.g. Alumni Homecoming 2026">
        </div>

        <div class="form-group">
          <label for="description">Event Description *</label>
          <textarea name="description" id="description" rows="4" required placeholder="Describe the event agenda, keynote speakers, venue details, and intended audience..."></textarea>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="date">Event Date *</label>
            <input type="date" name="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="regDate">Registration Deadline *</label>
            <input type="date" name="regDate" id="regDate" required>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="start">Start Time *</label>
            <input type="time" name="start" id="start" required>
          </div>
          <div class="form-group">
            <label for="end">End Time *</label>
            <input type="time" name="end" id="end" required>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label for="location">Location *</label>
            <input type="text" name="location" id="location" required placeholder="e.g. Main Auditorium / Virtual Stream">
          </div>
          <div class="form-group">
            <label for="capacity">Maximum Capacity</label>
            <input type="number" name="capacity" id="capacity" min="1" placeholder="e.g. 150 (default 100)">
          </div>
        </div>

        <div class="form-actions">
          <a class="btn btn-outline" href="event.html">Cancel</a>
          <button type="submit" class="btn btn-primary">Publish Event</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 University Alumni Network. All rights reserved.</p>
    <p>CS12012 &mdash; Web Development Group Assignment</p>
  </footer>

  <script src="eventcreate.js"></script>
</body>
</html>
